name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  client:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/digests.txt
      - name: Upload .deb packages for the apt job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-packages
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 1

  apt:
    name: apt
    runs-on: ubuntu-latest
    needs: client
    # prereleases are not published to the stable apt repository
    if: ${{ !contains(github.ref_name, '-') }}
    permissions: {}
    # deb-s3 rewrites and signs the repository index, so only one upload may
    # run at a time
    concurrency:
      group: apt-repo
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
      # renovate: datasource=rubygems depName=deb-s3
      DEB_S3_VERSION: 26.1.0
      # R2 does not support the CRC32 checksums newer AWS SDKs send by default
      # https://github.com/aws/aws-sdk-ruby/issues/3166
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    steps:
      - name: Download .deb packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-packages
          path: dist
      - name: Import GPG key
        run: printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Install deb-s3
        run: sudo gem install deb-s3 --version "$DEB_S3_VERSION" --no-document
      # credentials come from AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, so
      # they are not on the command line
      - name: Upload .deb packages to apt repository
        run: |
          deb-s3 upload \
            --bucket packages \
            --s3-region auto \
            --endpoint "$AWS_ENDPOINT_URL" \
            --sign "$GPG_KEY_ID" \
            --codename stable \
            --component main \
            --prefix am-autotask \
            --visibility nil \
            dist/*.deb
      - name: Upload public key to apt repository
        run: |
          gpg --armor --export "$GPG_KEY_ID" > pubkey.gpg
          aws s3 cp pubkey.gpg s3://packages/am-autotask/pubkey.gpg --region auto
