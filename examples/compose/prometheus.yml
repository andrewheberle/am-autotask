global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

# job names match the selectors in the example alerting rules
scrape_configs:
  - job_name: am-autotask
    static_configs:
      - targets: ["am-autotask:8080"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
