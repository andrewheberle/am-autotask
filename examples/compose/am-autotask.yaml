# am-autotask settings. Secrets are read from the Compose secrets mounted at
# /run/secrets. See the README for every setting.
webhook:
  tokenfile: /run/secrets/webhook-token
autotask:
  usernamefile: /run/secrets/autotask-username
  secretfile: /run/secrets/autotask-secret
  integrationcodefile: /run/secrets/autotask-integrationcode
company:
  # replace with the ID of your catch-all company
  catchall: 175
ticket:
  # replace with your Autotask instance's priority IDs
  priorities:
    critical: 4
    warning: 2
  defaultpriority: 3
