apiVersion: apps/v1
kind: Deployment
metadata:
  name: am-autotask
  labels:
    app.kubernetes.io/name: am-autotask
spec:
  # One replica, the leader, handles notifications and the other forwards
  # them to it (see leader election in the README). A rollout starts each new
  # pod before stopping an old one, and the leader releases its Lease on
  # shutdown, so a standby takes over at once.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: am-autotask
  template:
    metadata:
      labels:
        app.kubernetes.io/name: am-autotask
    spec:
      serviceAccountName: am-autotask
      # prefer replicas on different nodes, so one node failing leaves a standby
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: am-autotask
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # am-autotask allows 30 seconds for in-flight requests on shutdown
      terminationGracePeriodSeconds: 35
      containers:
        - name: am-autotask
          image: ghcr.io/andrewheberle/am-autotask:v0.11.0 # x-release-please-version
          args:
            - serve
            - --config=/etc/am-autotask/config.yaml
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: AM_AUTOTASK_LEADERELECTION_ENABLED
              value: "true"
            # where the other replica forwards notifications while this one
            # leads: the pod IP and the listen port
            - name: AM_AUTOTASK_LEADERELECTION_ADDRESS
              value: $(POD_IP):8080
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/am-autotask
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/am-autotask
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: am-autotask
        - name: secrets
          secret:
            secretName: am-autotask
