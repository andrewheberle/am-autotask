project_name: am-autotask

version: 2

builds:
  - id: am-autotask
    binary: am-autotask
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    main: ./cmd/am-autotask
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - netgo
    ldflags:
      - -s -w -X main.Version={{ .Version }}

gomod:
  proxy: true

# Release notes and CHANGELOG.md are written by release-please, which also
# creates the GitHub release that GoReleaser adds the artifacts to
changelog:
  disable: true

checksum:
  name_template: "checksums.txt"

release:
  mode: keep-existing
  draft: false
  make_latest: true
  replace_existing_artifacts: true
  prerelease: auto

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

sboms:
  - artifacts: binary
    disable: false

dockers_v2:
  - images:
      - "ghcr.io/andrewheberle/am-autotask"
    ids:
      - am-autotask
    tags:
      - "v{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    sbom: true
    disable: false
    platforms:
      - linux/amd64
    labels:
      "org.opencontainers.image.description": "A webhook receiver to Alertmanager to create tickets in Autotask"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.name": "{{ .ProjectName }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
    annotations:
      "org.opencontainers.image.description": "A webhook receiver to Alertmanager to create tickets in Autotask"

docker_digest:
  name_template: "digests.txt"

docker_signs:
  - cmd: cosign
    output: true
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes"
