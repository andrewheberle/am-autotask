project_name: am-autotask

version: 2

builds:
  - id: am-autotask
    binary: am-autotask
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    main: ./cmd/am-autotask
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - netgo
    ldflags:
      - -s -w -X main.Version={{ .Version }}

gomod:
  proxy: true

# Release notes and CHANGELOG.md are written by release-please, which also
# creates the GitHub release that GoReleaser adds the artifacts to
changelog:
  disable: true

checksum:
  name_template: "checksums.txt"

release:
  mode: keep-existing
  draft: false
  make_latest: true
  replace_existing_artifacts: true
  prerelease: auto
  use_existing_draft: true

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

sboms:
  - artifacts: binary
    disable: false
  - id: package
    artifacts: package
    disable: false

archives:
  - ids:
      - am-autotask
    allow_different_binary_count: true
    formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - ids:
      - am-autotask
    homepage: https://github.com/andrewheberle/am-autotask
    maintainer: Andrew Heberle <andrew.heberle@gmail.com>
    vendor: Andrew Heberle
    description: |-
      Alertmanager webhook receiver that raises Autotask tickets
      Receives Alertmanager notifications and raises and maintains Autotask
      tickets, one ticket per alert group, against the company the alerts
      belong to.
    license: MIT
    section: net
    formats:
      - deb
    contents:
      - src: systemd/am-autotask.service
        dst: /usr/lib/systemd/system/am-autotask.service
      - src: deb/config.example.yaml
        dst: /usr/share/doc/am-autotask/config.example.yaml
      # credentials are written here by the admin and read by systemd, so
      # only root may read them
      - dst: /etc/am-autotask/credentials
        type: dir
        file_info:
          mode: 0700
    scripts:
      postinstall: deb/postinstall.sh
      preremove: deb/preremove.sh
      postremove: deb/postremove.sh
    mtime: "{{ .CommitDate }}"

dockers_v2:
  - images:
      - "ghcr.io/andrewheberle/am-autotask"
    ids:
      - am-autotask
    tags:
      - "v{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    sbom: true
    disable: false
    platforms:
      - linux/amd64
    labels:
      "org.opencontainers.image.description": "A webhook receiver to Alertmanager to create tickets in Autotask"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.name": "{{ .ProjectName }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
    annotations:
      "org.opencontainers.image.description": "A webhook receiver to Alertmanager to create tickets in Autotask"

docker_digest:
  name_template: "digests.txt"

docker_signs:
  - cmd: cosign
    output: true
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes"
